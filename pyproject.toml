[project]
name = "datasette-cron"
version = "0.0.1a2"
description = "Scheduled tasks and background jobs for Datasette"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a39",
    "datasette-plugin-router>=0.0.1a2",
    "datasette-vite>=0.0.1a4",
    "pydantic>=2",
    "python-ulid>=3",
    "sqlite-migrate>=0.1b0",
    "sqlite-utils>=3.38",
    "croniter",
    "python-dateutil",
]

[dependency-groups]
dev = [
    "datasette-debug-gotham>=0.1.0a3",
    # The samples/ plugins use httpx2 directly. Datasette depends on it too,
    # but declare it here rather than lean on a transitive dep -- that is
    # exactly what broke when core moved off httpx.
    "httpx2>=2.0",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.0",
    "time-machine",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/datasette/datasette-cron"
Changelog = "https://github.com/datasette/datasette-cron/releases"
Issues = "https://github.com/datasette/datasette-cron/issues"
CI = "https://github.com/datasette/datasette-cron/actions"

[project.entry-points.datasette]
cron = "datasette_cron"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
datasette_cron = ["static/**/*", "templates/*", "manifest.json"]

[tool.setuptools.packages.find]
# Whitelist the package we ship. An exclude-based list let setuptools
# walk into build/lib/ from prior builds and re-stage it, recursing into
# build/lib/build/lib/... on every invocation.
include = ["datasette_cron*"]

[tool.ty.src]
exclude = ["tests/", "samples/", "frontend/"]

# TODO: drop this override (and raise the floor above) once a datasette
# release ships the first-request lifecycle work -- add_background_task(),
# the shutdown() hook, invoke_shutdown(). That work is merged to
# simonw/datasette main but not yet released: the published 1.0a39 tag
# predates it, so the >=1.0a39 floor above cannot express the real
# requirement on its own. Pinned to an exact main rev, not a branch, so
# resolution is reproducible and CI does not drift with new main commits.
[tool.uv.sources]
datasette = { git = "https://github.com/simonw/datasette", rev = "faff4c8820b231bfd771592cbe588e09834f5577" }
