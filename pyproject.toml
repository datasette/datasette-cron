[project]
name = "datasette-cron"
version = "0.0.1a2"
description = "Scheduled tasks and background jobs for Datasette"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a39",
    "datasette-plugin-router>=0.0.1a2",
    "opentelemetry-api>=1.37",
    "datasette-vite>=0.0.1a4",
    "pydantic>=2",
    "python-ulid>=3",
    "sqlite-migrate>=0.1b0",
    "sqlite-utils>=3.38",
    "croniter",
]

[dependency-groups]
dev = [
    "datasette-debug-gotham>=0.1.0a3",
    # The samples/ plugins use httpx2 directly. Datasette depends on it too,
    # but declare it here rather than lean on a transitive dep -- that is
    # exactly what broke when core moved off httpx.
    "httpx2>=2.0",
    "opentelemetry-distro>=0.58b0",
    "opentelemetry-sdk>=1.37",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.0",
    "time-machine",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/datasette/datasette-cron"
Changelog = "https://github.com/datasette/datasette-cron/releases"
Issues = "https://github.com/datasette/datasette-cron/issues"
CI = "https://github.com/datasette/datasette-cron/actions"

[project.entry-points.datasette]
cron = "datasette_cron"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
datasette_cron = ["static/**/*", "templates/*", "manifest.json"]

[tool.setuptools.packages.find]
# Whitelist the package we ship. An exclude-based list let setuptools
# walk into build/lib/ from prior builds and re-stage it, recursing into
# build/lib/build/lib/... on every invocation.
include = ["datasette_cron*"]

[tool.ty.src]
exclude = ["tests/", "samples/", "frontend/"]

# Keep the formatter out of Markdown. ruff 0.16 began formatting Python code
# blocks inside .md, which rewrites README's samples: aligned trailing comments
# get flattened to a single space, so `"0 8 * * *"  # every morning at 8` loses
# the column that makes a block of them readable. The samples are documentation
# -- some are deliberately partial -- and a formatter should not own them.
#
# uv.lock is git-ignored and pyproject only floors ruff, so a fresh resolve (CI,
# or any new checkout) picks up 0.16.x while older cached environments stay on
# 0.15.x and never look at .md at all. Without this, `just format-check` passes
# locally and fails in CI.
[tool.ruff.format]
exclude = ["*.md"]

# TODO: drop this override (and raise the floor above) once a datasette
# release ships the plugin telemetry kit (datasette.telemetry,
# datasette.telemetry_registry, datasette.telemetry_testing).
#
# The first-request lifecycle work (add_background_task, the shutdown hook)
# shipped in 1.0a40, which is why first-request-port needs no override. The
# telemetry kit is still unreleased, so this branch resolves from
# simonw/datasette's otel plugin-kit branch, pinned to an exact rev -- that
# branch is main + the otel stack and already carries the lifecycle work.
# The floor stays at 1.0a39 because that is the version the pinned rev
# reports; a 1.0a40 floor would make the override unresolvable.
[tool.uv.sources]
datasette = { git = "https://github.com/simonw/datasette", rev = "4579a19520b502e90662a79ebd84555a87542340" }
